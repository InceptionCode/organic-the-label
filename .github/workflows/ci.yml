name: CI

# v2 and apps/api checks, bun-based (phase 08.0). v1 is being archived and has no jobs here.
# Docs: apps/v2/docs/internal-docs/ci-cd.md

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      v2: ${{ steps.filter.outputs.v2 }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
            v2:
              - *shared
              - 'apps/v2/**'
            api:
              - *shared
              - 'apps/api/**'

  v2:
    name: v2 (lint, types, unit, build, entry budget)
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    # Dev values only: the build inlines the VITE_ client values.
    environment: preview
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_HCAPTCHA_SITE_KEY: ${{ secrets.VITE_HCAPTCHA_SITE_KEY }}
      VITE_MEMBERSHIP_ENABLED: ${{ secrets.VITE_MEMBERSHIP_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:v2

      - name: Type-check
        run: bun run type-check:v2

      - name: Unit tests
        run: bun run --cwd apps/v2 test

      - name: Build
        run: bun run --cwd apps/v2 build

      - name: Entry bundle budget
        run: bun run --cwd apps/v2 check:entry

  api:
    name: apps/api (types, tests, build)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check:api

      - name: Tests
        run: bun run --cwd apps/api test

      - name: Build
        run: bun run --cwd apps/api build

  v2-e2e:
    name: v2 E2E (Playwright, sandboxed :3101 server)
    needs: [changes, v2]
    if: github.event_name == 'push' && needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dev values only. PROD_SUPABASE_URL feeds the production guard in e2e/support/env.ts, which
    # refuses to run in CI without it and refuses whenever the dev URL matches it.
    environment: preview
    env:
      CI: 'true'
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_HCAPTCHA_SITE_KEY: ${{ secrets.VITE_HCAPTCHA_SITE_KEY }}
      VITE_MEMBERSHIP_ENABLED: ${{ secrets.VITE_MEMBERSHIP_ENABLED }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SHOPIFY_DEV_STORE_DOMAIN: ${{ secrets.SHOPIFY_DEV_STORE_DOMAIN }}
      SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
      SHOPIFY_STOREFRONT_API_VERSION: ${{ secrets.SHOPIFY_STOREFRONT_API_VERSION }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM_SUPPORT: ${{ secrets.EMAIL_FROM_SUPPORT }}
      EMAIL_FROM_DOWNLOADS: ${{ secrets.EMAIL_FROM_DOWNLOADS }}
      SUPPORT_FORWARD_EMAIL: ${{ secrets.SUPPORT_FORWARD_EMAIL }}
      MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
      MAILERLITE_GROUP_NEWSLETTER_ID: ${{ secrets.MAILERLITE_GROUP_NEWSLETTER_ID }}
      MAILERLITE_GROUP_FREE_RESOURCE_LEADS_ID: ${{ secrets.MAILERLITE_GROUP_FREE_RESOURCE_LEADS_ID }}
      MAILERLITE_GROUP_DOWNLOADED_STARTER_KIT_ID: ${{ secrets.MAILERLITE_GROUP_DOWNLOADED_STARTER_KIT_ID }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      CACHE_PURGE_SECRET: ${{ secrets.CACHE_PURGE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: apps/v2
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run --cwd apps/v2 test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The CI reporter is `github` (no HTML report); test-results holds each failure's trace.zip
          # and error-context.md. Open a trace with `bunx playwright show-trace <trace.zip>`.
          path: |
            apps/v2/playwright-report/
            apps/v2/test-results/
          retention-days: 7
