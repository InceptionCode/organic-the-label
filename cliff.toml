# git-cliff configuration — https://git-cliff.org/docs/configuration
# The changelog is generated from Conventional Commit messages. Never edited by hand.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### 💥 Breaking Changes
{% for commit in breaking %}
- {{ commit.breaking_description | default(value=commit.message) | split(pat="\n") | first | upper_first | trim }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/InceptionCode/organic-the-label/commit/{{ commit.id }}))
{%- endfor %}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/InceptionCode/organic-the-label/commit/{{ commit.id }})){% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/InceptionCode/organic-the-label/pull/{{ commit.remote.pr_number }}){% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  { message = "^ci", group = "<!-- 6 -->⚙️ CI & Build" },
  { message = "^build", group = "<!-- 6 -->⚙️ CI & Build" },
  { message = "^style", group = "<!-- 7 -->🎨 Styling" },
  { message = "^chore", group = "<!-- 8 -->🧹 Chores" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.6.0"

[remote.github]
owner = "InceptionCode"
repo = "organic-the-label"
